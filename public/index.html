<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Media Player Redux — an open-source Garry's Mod addon for synchronized media streaming in multiplayer.">

    <title>Media Player Redux — Open Source</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% -20%, #252525 0%, #111 45%, #0a0a0a 100%);
            color: #f5f5f5;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container { width: 100%; max-width: 680px; text-align: center; }

        h1 {
            margin-bottom: 18px;
            font-size: clamp(42px, 8vw, 72px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: -0.045em;
        }

        .subtitle {
            max-width: 560px;
            margin: 0 auto 34px;
            color: #a8a8a8;
            font-size: 18px;
            line-height: 1.65;
        }

        .footer {
            margin-top: 70px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        .footer a { color: #888; text-decoration: none; }
        .footer a:hover { color: #aaa; text-decoration: underline; }
    </style>
</head>

<body>
    <main class="container">
        <h1>Media Player</h1>

        <p class="subtitle">
            This page is part of Media Player Redux, an open-source
            Garry's Mod addon for synchronized media streaming in multiplayer.
            The project allows players to watch and listen to media together,
            with synchronized playback across players.
        </p>

        <div class="footer">
            <p>
                Open source software ·
                <a href="https://github.com/PurrCoding/gm-mediaplayer" target="_blank" rel="noopener noreferrer">
                    PurrCoding / gm-mediaplayer
                </a>
            </p>
        </div>
    </main>
</body>

</html>
